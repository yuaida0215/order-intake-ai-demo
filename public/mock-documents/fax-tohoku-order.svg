<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <filter id="scrawlBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
  </defs>

  <!-- 用紙 (わずかにグレーがかった白 = スキャン紙) -->
  <rect x="0" y="0" width="800" height="1130" fill="#fbfbfa" />
  <rect x="1" y="1" width="798" height="1128" fill="none" stroke="#d8d8d6" stroke-width="2" />

  <!-- 受信FAX機が印字するヘッダ (スキャン面には追従しない = 直立のまま) -->
  <text x="40" y="26" font-family="'Courier New',monospace" font-size="11" letter-spacing="0.5" fill="#555555">2026/07/01 16:18  FROM: 022-XXX-XXXX 東北商事(株)  TO: 03-XXXX-XXXX  P.01/01</text>
  <line x1="40" y1="34" x2="760" y2="34" stroke="#999999" stroke-width="0.75" opacity="0.6" />

  <!-- 本文 (紙がわずかに傾いてスキャンされた体) -->
  <g transform="rotate(-0.4 400 565)">

    <text x="400" y="112" text-anchor="middle" font-size="32" font-weight="700" letter-spacing="10" fill="#1a1a1a">注 文 書</text>

    <text x="60" y="192" font-size="17" font-weight="700" fill="#1a1a1a">株式会社サンプルシステムズ　御中</text>

    <text x="740" y="172" text-anchor="end" font-size="15" font-weight="700" fill="#1a1a1a">東北商事株式会社</text>
    <text x="740" y="194" text-anchor="end" font-size="13" fill="#333333">仕入担当　高橋</text>
    <text x="740" y="232" text-anchor="end" font-size="13" fill="#333333">注文日：2026年7月1日</text>

    <line x1="60" y1="262" x2="740" y2="262" stroke="#1a1a1a" stroke-width="1.5" />

    <text x="60" y="312" font-size="16" fill="#1a1a1a">商品：冷凍うどんセット (FZ-030)</text>
    <text x="60" y="347" font-size="16" fill="#1a1a1a">数量：120ケース</text>
    <text x="60" y="382" font-size="16" fill="#1a1a1a">納品先：宮城県仙台市青葉区1-3-5</text>

    <line x1="60" y1="412" x2="740" y2="412" stroke="#dddddd" stroke-width="1" />

    <!-- 希望納品日 記入欄 (罫線枠) -->
    <rect x="60" y="450" width="680" height="92" fill="none" stroke="#999999" stroke-width="1" />
    <text x="80" y="503" font-size="17" font-weight="700" fill="#1a1a1a">希望納品日：</text>

    <!-- 手書き: 「7」(震えた線・判読可能程度) -->
    <path d="M 232 480 C 246 477, 262 478, 279 481 C 271 480, 265 483, 262 487"
          fill="none" stroke="#2a2a2a" stroke-width="3.2" stroke-linecap="round" opacity="0.78" />
    <path d="M 276 481 C 264 500, 253 519, 246 536 C 244 541, 243 544, 242 547"
          fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- 手書き: 「/」(震えた線・判読可能程度) -->
    <path d="M 300 546 C 305 531, 310 516, 314 501 C 317 491, 320 482, 323 473"
          fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" opacity="0.72" />

    <!-- 手書き: 日付部分 (かすれて判読不能 - 低opacity・途切れた複数ストローク＋blur) -->
    <g filter="url(#scrawlBlur)" opacity="0.3">
      <path d="M 345 505 C 355 492, 366 519, 376 500" fill="none" stroke="#2a2a2a" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 372 512 C 378 496, 384 528, 391 508" fill="none" stroke="#2a2a2a" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 398 500 C 406 522, 412 494, 420 514" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" />
    </g>
    <g filter="url(#scrawlBlur)" opacity="0.22">
      <path d="M 432 508 C 440 495, 448 521, 457 503" fill="none" stroke="#2a2a2a" stroke-width="2.7" stroke-linecap="round" />
      <path d="M 452 498 C 460 516, 466 492, 475 510" fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <g filter="url(#scrawlBlur)" opacity="0.2">
      <path d="M 486 512 C 494 498, 500 524, 508 505" fill="none" stroke="#2a2a2a" stroke-width="2.6" stroke-linecap="round" />
    </g>

    <text x="60" y="600" font-size="12" fill="#777777">備考：</text>
    <line x1="110" y1="596" x2="740" y2="596" stroke="#cccccc" stroke-width="0.75" />
    <line x1="60" y1="630" x2="740" y2="630" stroke="#cccccc" stroke-width="0.75" />

    <text x="60" y="700" font-size="12" fill="#888888">※本注文書は複合機FAXにて受信したスキャン原稿です。手書き欄は原本にてご確認ください。</text>
  </g>

  <!-- スキャンノイズ: 走査線由来の水平筋 (用紙の傾きに追従しない) -->
  <line x1="0" y1="146" x2="800" y2="146" stroke="#000000" stroke-width="0.6" opacity="0.035" />
  <line x1="0" y1="268" x2="800" y2="268" stroke="#000000" stroke-width="0.5" opacity="0.03" />
  <line x1="0" y1="399" x2="800" y2="399" stroke="#000000" stroke-width="0.6" opacity="0.04" />
  <line x1="0" y1="561" x2="800" y2="561" stroke="#000000" stroke-width="0.5" opacity="0.03" />
  <line x1="0" y1="733" x2="800" y2="733" stroke="#000000" stroke-width="0.6" opacity="0.035" />
  <line x1="0" y1="884" x2="800" y2="884" stroke="#000000" stroke-width="0.5" opacity="0.03" />
  <line x1="0" y1="1002" x2="800" y2="1002" stroke="#000000" stroke-width="0.6" opacity="0.03" />

  <!-- スキャンノイズ: 小さな斑点 -->
  <circle cx="97" cy="221" r="0.9" fill="#000000" opacity="0.22" />
  <circle cx="612" cy="158" r="1.1" fill="#000000" opacity="0.18" />
  <circle cx="705" cy="366" r="0.7" fill="#000000" opacity="0.25" />
  <circle cx="151" cy="429" r="1.2" fill="#000000" opacity="0.16" />
  <circle cx="663" cy="612" r="0.8" fill="#000000" opacity="0.2" />
  <circle cx="204" cy="656" r="1" fill="#000000" opacity="0.18" />
  <circle cx="537" cy="720" r="0.7" fill="#000000" opacity="0.24" />
  <circle cx="76" cy="800" r="1.1" fill="#000000" opacity="0.15" />
  <circle cx="729" cy="845" r="0.8" fill="#000000" opacity="0.2" />
  <circle cx="316" cy="912" r="0.9" fill="#000000" opacity="0.18" />
  <circle cx="450" cy="990" r="0.7" fill="#000000" opacity="0.22" />
  <circle cx="185" cy="1040" r="1" fill="#000000" opacity="0.16" />
</svg>
